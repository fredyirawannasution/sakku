<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>Aplikasi Keuangan</title>

  <!-- ICON WEB / BROWSER -->
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon.png">
  <link rel="shortcut icon" href="assets/icons/favicon.png">

  <!-- ICON MOBILE / ADD TO HOME SCREEN -->
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="assets/icons/icon-512.png">

  <!-- MANIFEST APP MOBILE -->
  <link rel="manifest" href="manifest.json">

  <!-- WARNA APP -->
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-title" content="Keuangan">
  <meta name="application-name" content="Keuangan">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <style>
    :root{
      --bg:#f3f6fb;
      --card:#ffffff;
      --text:#101828;
      --muted:#667085;
      --line:#e4e7ec;
      --primary:#2563eb;
      --danger:#d92d20;
      --shadow:0 18px 45px rgba(16,24,40,.12);
      --safe-top:env(safe-area-inset-top,0px);
      --safe-bottom:env(safe-area-inset-bottom,0px);
    }

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
    }

    html,
    body{
      width:100%;
      height:100%;
      margin:0;
      overflow:hidden;
      background:var(--bg);
      font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      color:var(--text);
    }

    body{
      position:fixed;
      inset:0;
    }

    .app-shell{
      position:fixed;
      inset:0;
      display:grid;
      background:var(--bg);
      padding-top:var(--safe-top);
      padding-bottom:var(--safe-bottom);
    }

    .frame{
      width:100%;
      height:100%;
      border:0;
      display:block;
      background:#fff;
    }

    .error{
      position:fixed;
      inset:0;
      display:grid;
      place-items:center;
      padding:18px;
      background:linear-gradient(135deg,#eff6ff,#f8fafc);
      z-index:5;
    }

    .card{
      width:100%;
      max-width:420px;
      background:var(--card);
      border:1px solid var(--line);
      border-radius:24px;
      padding:22px;
      box-shadow:var(--shadow);
      text-align:center;
    }

    .logo{
      width:58px;
      height:58px;
      border-radius:18px;
      background:var(--primary);
      display:grid;
      place-items:center;
      color:#fff;
      font-weight:950;
      margin:0 auto 14px;
      font-size:18px;
      overflow:hidden;
    }

    h1{
      font-size:20px;
      margin:0 0 8px;
    }

    .muted{
      font-size:13px;
      color:var(--muted);
      line-height:1.5;
      margin:0;
    }

    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:46px;
      border-radius:14px;
      padding:12px 16px;
      background:var(--primary);
      color:#fff;
      text-decoration:none;
      font-weight:900;
      margin-top:14px;
      border:0;
      cursor:pointer;
      width:100%;
    }

    .btn-lite{
      background:#eef4ff;
      color:var(--primary);
    }

    .code{
      font-size:12px;
      background:#f2f4f7;
      border:1px solid var(--line);
      padding:10px;
      border-radius:12px;
      word-break:break-all;
      text-align:left;
      margin-top:12px;
      color:#344054;
    }

    .hide{
      display:none!important;
    }
  </style>
</head>

<body>

  <!-- APLIKASI UTAMA -->
  <div class="app-shell">
    <iframe
      id="appFrame"
      class="frame"
      title="Aplikasi Keuangan"
      allow="clipboard-read; clipboard-write; notifications">
    </iframe>
  </div>

  <!-- ERROR JIKA URL /exec TIDAK VALID -->
  <div id="error" class="error hide">
    <div class="card">

      <div class="logo">!</div>

      <h1>URL /exec belum diisi</h1>

      <p class="muted">
        Buka file ini di GitHub, lalu ganti isi
        <b>APPS_SCRIPT_EXEC_URL</b>
        dengan URL Web App Google Apps Script yang berakhiran
        <b>/exec</b>.
      </p>

      <div class="code">
        const APPS_SCRIPT_EXEC_URL = 'https://script.google.com/macros/s/AKfycbxdwbS-1yh6m1KLzFGNbRYPt1N7WaOp2QF9_qUssPXXBrlUHidjMR2ni2E2VeHd9Luy/exec';
      </div>

      <button class="btn btn-lite" onclick="location.reload()">
        Muat Ulang
      </button>

    </div>
  </div>

  <script>
    /*
      CARA PAKAI:

      1. Deploy Google Apps Script sebagai Web App.
      2. Copy URL yang berakhiran /exec.
      3. Tempel di bagian APPS_SCRIPT_EXEC_URL.
      4. Upload file ini ke GitHub sebagai index.html.
      5. Buat manifest.json.
      6. Upload icon ke folder assets/icons/.
      7. Hubungkan repo GitHub ke Cloudflare Pages.

      CATATAN:
      - Tidak ada lagi halaman Loading.
      - Tidak ada spinner.
      - Tidak ada overlay loading.
      - iframe langsung diarahkan ke Apps Script.
    */

    const APPS_SCRIPT_EXEC_URL =
      'https://script.google.com/macros/s/AKfycbzSG7_iVrJq6TBQh9uQnZSXZ9rDQc8dcvZr-ZXHJcQyQSIwDNGJQH8r-CMV4xugXq43/exec';

    const frame = document.getElementById('appFrame');
    const errorBox = document.getElementById('error');

    /*
      Validasi URL Web App Google Apps Script
    */
    function isValidExecUrl(url){
      return /^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec(\?.*)?$/
        .test(String(url || '').trim());
    }

    /*
      Jalankan aplikasi langsung
    */
    function start(){

      const url = String(APPS_SCRIPT_EXEC_URL || '').trim();

      /*
        Jika URL tidak valid,
        tampilkan halaman error.
      */
      if (!isValidExecUrl(url)) {
        errorBox.classList.remove('hide');
        return;
      }

      /*
        Tambahkan parameter versi untuk
        menghindari cache URL iframe.
      */
      const separator = url.includes('?') ? '&' : '?';

      const noCacheUrl =
        url + separator + 'v=' + Date.now();

      /*
        Langsung buka aplikasi.
        Tidak ada loading overlay.
      */
      frame.src = noCacheUrl;
    }

    /*
      Mulai aplikasi
    */
    start();
  </script>

</body>
</html>
