<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
  >

  <meta
    http-equiv="Cache-Control"
    content="no-cache, no-store, must-revalidate"
  >
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>Aplikasi Keuangan</title>

  <!-- APP SETTINGS -->
  <meta name="theme-color" content="#2563eb">
  <meta
    name="apple-mobile-web-app-title"
    content="Keuangan"
  >
  <meta
    name="application-name"
    content="Keuangan"
  >
  <meta
    name="mobile-web-app-capable"
    content="yes"
  >
  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >
  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  >

  <style>
    :root{
      --bg:#f3f6fb;
      --card:#ffffff;
      --text:#101828;
      --muted:#667085;
      --line:#e4e7ec;
      --primary:#2563eb;
      --shadow:0 18px 45px rgba(16,24,40,.12);

      --safe-top:env(safe-area-inset-top,0px);
      --safe-bottom:env(safe-area-inset-bottom,0px);
    }

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
    }

    html,
    body{
      width:100%;
      height:100%;
      margin:0;
      padding:0;
      overflow:hidden;
      background:var(--bg);

      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      color:var(--text);
    }

    body{
      position:fixed;
      inset:0;
    }

    /*
      ============================================================
      WRAPPER UTAMA
      ============================================================
    */

    .app-shell{
      position:fixed;
      inset:0;

      width:100%;
      height:100%;

      display:block;

      background:#fff;

      padding-top:var(--safe-top);
      padding-bottom:var(--safe-bottom);
    }

    /*
      ============================================================
      GOOGLE APPS SCRIPT
      ============================================================
    */

    .frame{
      display:block;

      width:100%;
      height:100%;

      margin:0;
      padding:0;

      border:0;

      background:#fff;
    }

    /*
      ============================================================
      ERROR
      ============================================================
    */

    .error{
      position:fixed;
      inset:0;

      z-index:10;

      display:grid;
      place-items:center;

      padding:18px;

      background:
        linear-gradient(
          135deg,
          #eff6ff,
          #f8fafc
        );
    }

    .card{
      width:100%;
      max-width:420px;

      padding:22px;

      background:var(--card);

      border:1px solid var(--line);
      border-radius:24px;

      box-shadow:var(--shadow);

      text-align:center;
    }

    h1{
      margin:0 0 8px;

      font-size:20px;
      line-height:1.3;
    }

    .muted{
      margin:0;

      font-size:13px;
      line-height:1.5;

      color:var(--muted);
    }

    .code{
      margin-top:12px;
      padding:10px;

      background:#f2f4f7;

      border:1px solid var(--line);
      border-radius:12px;

      color:#344054;

      font-size:12px;
      line-height:1.5;

      word-break:break-all;

      text-align:left;
    }

    .btn{
      display:inline-flex;

      align-items:center;
      justify-content:center;

      width:100%;
      min-height:46px;

      margin-top:14px;
      padding:12px 16px;

      border:0;
      border-radius:14px;

      background:var(--primary);
      color:#fff;

      font-weight:900;

      text-decoration:none;

      cursor:pointer;
    }

    .btn-lite{
      background:#eef4ff;
      color:var(--primary);
    }

    .hide{
      display:none !important;
    }
  </style>
</head>

<body>

  <!--
    ============================================================
    WRAPPER UTAMA
    ============================================================

    File ini hanya berfungsi sebagai wrapper untuk
    Google Apps Script.

    TIDAK ADA:
    - Loading screen
    - Spinner
    - Logo
    - Foto
    - Favicon
    - Manifest PWA
    - Form login
    - CRUD

    Semua fungsi aplikasi berasal dari Google Apps Script.
  -->

  <main class="app-shell">

    <iframe
      id="appFrame"
      class="frame"
      title="Aplikasi Keuangan"
      allow="clipboard-read; clipboard-write; notifications"
      loading="eager"
      referrerpolicy="no-referrer-when-downgrade">
    </iframe>

  </main>


  <!--
    ============================================================
    ERROR URL
    ============================================================
  -->

  <div
    id="error"
    class="error hide"
    role="alert"
  >

    <div class="card">

      <h1>URL /exec belum diisi</h1>

      <p class="muted">
        URL Google Apps Script belum valid.
        Pastikan menggunakan URL Web App yang berakhiran
        <b>/exec</b>.
      </p>

      <div class="code">
        const APPS_SCRIPT_EXEC_URL =
        'TEMPEL_URL_EXEC_APPS_SCRIPT_DI_SINI';
      </div>

      <button
        type="button"
        class="btn btn-lite"
        onclick="location.reload()"
      >
        Muat Ulang
      </button>

    </div>

  </div>


  <script>

    /*
      ============================================================
      GOOGLE APPS SCRIPT WEB APP
      ============================================================
    */

    const APPS_SCRIPT_EXEC_URL =
      'https://script.google.com/macros/s/AKfycbwbGhmvG9D9TRJAaLp1MnG12tHPR20LTSoA6cu0Mr3Igy1X3kKo7ft7JAZcTIpti4TF/exec';


    /*
      ============================================================
      ELEMENT
      ============================================================
    */

    const frame =
      document.getElementById('appFrame');

    const errorBox =
      document.getElementById('error');


    /*
      ============================================================
      VALIDASI URL
      ============================================================
    */

    function isValidExecUrl(url){

      return /^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec(?:\?.*)?$/
        .test(
          String(url || '').trim()
        );

    }


    /*
      ============================================================
      START
      ============================================================
    */

    function start(){

      const url =
        String(
          APPS_SCRIPT_EXEC_URL || ''
        ).trim();


      /*
        URL tidak valid
      */

      if(!isValidExecUrl(url)){

        errorBox.classList.remove('hide');

        return;
      }


      /*
        Tambahkan parameter versi
        agar deployment lama tidak tertahan cache.
      */

      const separator =
        url.includes('?')
          ? '&'
          : '?';


      const appUrl =
        url +
        separator +
        'v=' +
        Date.now();


      /*
        LANGSUNG LOAD GAS
      */

      frame.src = appUrl;

    }


    /*
      ============================================================
      START APPLICATION
      ============================================================
    */

    start();

  </script>

</body>
</html>
